<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f2ea" />
    <script>
      try {
        const storedTheme = localStorage.getItem("fp-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (storedTheme === "dark" || (storedTheme === null && prefersDark)) {
          document.documentElement.classList.add("dark");
        }
      } catch {}
    </script>
    <meta name="description" content="Finance Pulse helps you understand your income, spending, and financial habits with a thoughtful private workspace." />
    <title>Finance Pulse — A clearer view of your money</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
